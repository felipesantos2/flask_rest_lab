[project]
name = "flask-rest-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "felipesantos2", email = "santospinheiro627@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "jinja2>=3.1.6",
    "mysql-connector-python>=26.7.0",
    "rich-cli>=1.8.1",
    "weasyprint>=69.0",
]

[project.scripts]
flask-rest-lab = "flask_rest_lab:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]
